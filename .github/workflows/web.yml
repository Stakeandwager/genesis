# Builds the Godot web export on every push to prototype-002a and publishes it
# to Netlify. The game is exported with the SINGLE-THREADED template, so the
# result is plain static files and needs no COOP/COEP headers.
#
# No API key is ever placed in the build. api_key.txt is deliberately absent,
# and the game says so: "No API key. Raw JSON only." Anything under res:// is
# packed into index.pck, which anyone can download and read, so a key here
# would be a published key.
#
# Secrets this needs, set in GitHub under Settings -> Secrets and variables
# -> Actions:
#   NETLIFY_AUTH_TOKEN   a personal access token from Netlify
#   NETLIFY_SITE_ID      the site's API ID, on its Site configuration page
#
# And one set on the NETLIFY SITE itself, never here and never in the
# repository: GEMINI_API_KEY, which netlify/functions/interpret.js reads. The
# build carries no key; the function holds it.

name: web build

on:
  push:
    branches: [prototype-002a]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      GODOT: "4.7.1"

    steps:
      - uses: actions/checkout@v4

      - name: Fetch Godot and its web export template
        run: |
          set -eux
          base="https://github.com/godotengine/godot/releases/download/${GODOT}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT}-stable_linux.x86_64.zip"
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT}-stable_export_templates.tpz"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT}-stable_linux.x86_64"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT}.stable"
          unzip -q -o templates.tpz -d tpl "templates/web*"
          cp tpl/templates/web*.zip "$HOME/.local/share/godot/export_templates/${GODOT}.stable/"

      - name: Import, then export
        run: |
          set -eux
          test ! -f api_key.txt
          cp export_presets.web.cfg export_presets.cfg
          mkdir -p build
          "./Godot_v${GODOT}-stable_linux.x86_64" --headless --import || true
          "./Godot_v${GODOT}-stable_linux.x86_64" --headless \
            --export-release "Web" "$PWD/build/index.html"
          ls -la build
          test -s build/index.wasm

      # The Netlify CLI rather than a third-party action: its flags are the
      # documented ones, and nothing here depends on another project's input
      # names staying what they were.
      #
      # --prod puts every push on ONE URL rather than minting a new preview
      # link each time, because the point of this is a place the owner can
      # revisit and complain about. When there is a stranger-facing link to
      # protect, this becomes a preview and the live URL moves deliberately.
      # 111: THE COMMIT MESSAGE REACHES THE CLI AS DATA, THROUGH THE
      # ENVIRONMENT, AND IS NEVER INTERPOLATED INTO THIS SCRIPT.
      #
      # ${{ }} is substituted by GitHub into the TEXT of the script before
      # bash is started, so a commit message carrying a backtick or a $( had
      # the shell run whatever was inside it. That is not a hypothetical:
      # run 133 (commit b433455, pushed 2026-10-31) logged
      #   line 1: file.gd:385: command not found
      #   line 1: :401: command not found
      # because 110's message quoted `file.gd:385`, `:401` - and the string
      # the CLI then received had that text silently deleted from it. 25 of
      # 176 commit messages on this branch contain a backtick.
      #
      # The two secrets below were already passed this way and were always
      # right. The message was the one of the three that was not; the pattern
      # it should have had was three lines underneath it.
      - name: Publish to Netlify
        run: |
          npx --yes netlify-cli@17 deploy \
            --prod \
            --dir build \
            --functions netlify/functions \
            --message "$COMMIT_MESSAGE" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --site "$NETLIFY_SITE_ID"
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
